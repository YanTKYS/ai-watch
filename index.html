<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="生成AIの最新動向（公式発表・リリースノート）を日刊で収集し、全期間から検索できます。">
  <title>ai-watch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>ai-watch</h1>
      <p class="lead">生成AIの最新動向（公式発表・リリースノート）を日刊で収集</p>
      <div class="controls">
        <label>
          <span class="visually-hidden">表示する月</span>
          <select id="month-select" disabled></select>
        </label>
        <label class="order-picker">
          <span>並び順</span>
          <select id="order-select" disabled>
            <option value="desc" selected>新しい順</option>
            <option value="asc">古い順</option>
          </select>
        </label>
        <div class="search-box" role="search">
          <label for="search-input" class="visually-hidden">日刊ログを全期間からキーワード検索</label>
          <input type="search" id="search-input" placeholder="全期間を検索（例: Codex）" autocomplete="off" enterkeyhint="search">
          <button type="button" id="search-clear" disabled>クリア</button>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section id="collection-health" class="collection-health" aria-labelledby="collection-health-title">
      <h2 id="collection-health-title" class="visually-hidden">収集状況とデータ鮮度</h2>
      <div role="status" aria-live="polite">
        <p id="collection-summary">収集状況: 状態不明</p>
        <p id="collection-detail" class="meta">最後に公開された状態を確認中です。</p>
        <p id="index-summary" class="meta">検索インデックス: 状態不明</p>
      </div>
      <details id="collection-feed-details" hidden>
        <summary>情報源ごとの状況</summary>
        <p class="meta">公式フィードだけの記録です。Braveの成否や現在のジョブ稼働は表しません。</p>
        <ul id="collection-feeds"></ul>
      </details>
    </section>
    <p id="notice" class="notice" hidden>サンプルデータ（架空の記事）を表示しています。実際の収集結果は <a href="./">トップページ</a> で確認できます。</p>
    <div id="status" role="status" aria-live="polite">読み込み中...</div>
    <button type="button" id="load-retry" aria-describedby="status" aria-controls="content" hidden>再試行</button>
    <div id="content"></div>
  </main>
  <noscript><p class="wrap">このページの表示にはJavaScriptが必要です。ログは <a href="logs/">logs/</a> のMarkdownで直接読めます。</p></noscript>
  <script src="parser.js"></script>
  <script src="collection-status.js"></script>
  <script src="app.js"></script>
</body>
</html>
